name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacoes:
    name: Lint, tipos e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Inclui as regressões dos gates de papel (carregando → erro → sem papel)
      # e de troca de conta.
      - run: bun run test

  e2e-auth:
    name: E2E auth (rede afunilada e troca de conta)
    runs-on: ubuntu-latest
    env:
      # Sem sessão nos secrets o cenário anônimo ainda roda e continua falhando
      # o build se qualquer texto de bloqueio piscar.
      LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
      LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}
      LOVABLE_BROWSER_SUPABASE_SESSION_JSON_2: ${{ secrets.E2E_SUPABASE_SESSION_JSON_2 }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_APP_VERSION: ${{ github.sha }}
      # Trace único por execução: casa artefatos do E2E com auth_telemetria.trace_id
      E2E_TRACE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Destino fake interceptado pelo teste: permite validar o contrato dos
      # eventos exportados (trace_id + versão + rota) antes do deploy.
      VITE_TELEMETRY_EXPORT_URL: http://127.0.0.1:9/telemetria-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bun install --frozen-lockfile

      - name: Instalar Playwright (Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Subir o app
        run: |
          bun run dev --port 8080 > /tmp/dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "dev server não respondeu"; cat /tmp/dev-server.log; exit 1

      # Falha o build em QUALQUER ocorrência dos textos de bloqueio
      # ("Acesso não liberado" / "Falha de conexão") durante o carregamento.
      - name: Gates de auth (rotas críticas por papel e tipo de navegação)
        run: bun run test:e2e:auth

      # Falha o build se algum evento exportado estiver sem trace_id, versão ou rota.
      - name: Validar contrato da telemetria exportada
        run: bun run validar:telemetria

      - name: Tours de onboarding (primeira visita, conclusão e mobile)
        run: bun run test:e2e:onboarding

      # Falha o build se /admin não carregar para o admin ou se aparecer erro de
      # React (#310). Screenshot + dump saem com o mesmo Trace ID desta execução.
      - name: Painel admin carrega sem erro de React
        run: bun run test:e2e:admin

      - name: Evidências (vídeo, screenshot e HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth-evidencias-${{ github.run_id }}
          path: |
            tests/e2e/artifacts/**
            /tmp/dev-server.log
          if-no-files-found: ignore
          retention-days: 14
